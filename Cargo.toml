[package]
name = "jeb"
version = "0.0.1"
edition = "2021"
description = "CLI tool to make quick decisions with TypeSafe AI's System One API"
readme = "README.md"
license = "MIT"
repository = "https://github.com/typesafe-ai/jeb"
keywords = ["oracle", "decision-engine", "ai-agents", "typesafe", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
